<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open in Orion Store</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: linear-gradient(145deg, #18181b, #1e1e24);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 2rem;
            padding: 3rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo {
            width: 80px; height: 80px;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: 900; color: #fff;
            box-shadow: 0 8px 30px rgba(99,102,241,0.3);
        }
        h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
        .sub { color: #a1a1aa; font-size: 0.875rem; margin-bottom: 2rem; line-height: 1.5; }
        .app-id { font-family: monospace; background: rgba(255,255,255,0.06); padding: 0.15em 0.5em; border-radius: 0.375rem; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 1rem;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: #a1a1aa; font-size: 0.8rem; margin-bottom: 1.5rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.875rem 2rem;
            border-radius: 1rem;
            font-size: 0.95rem; font-weight: 700;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer; border: none;
        }
        .btn:hover { transform: scale(1.03); }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #e4e4e7;
            margin-top: 0.75rem;
        }
        .hidden { display: none; }
        .footer { margin-top: 2rem; color: #52525b; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">O</div>
        <h1>Orion Store</h1>
        <p class="sub" id="message">Opening <span class="app-id" id="app-label">app</span> in Orion Store...</p>

        <div id="loading">
            <div class="spinner"></div>
            <p class="status">Attempting to launch Orion Store...</p>
        </div>

        <div id="fallback" class="hidden">
            <p class="sub">Orion Store doesn't seem to be installed on this device.</p>
            <a id="download-btn" class="btn btn-primary" href="https://github.com/RookieEnough/Orion-Store/releases/latest">
                ⬇ Download Orion Store
            </a>
            <br>
            <a id="retry-btn" class="btn btn-secondary" href="#">
                ↻ Try opening again
            </a>
        </div>

        <p class="footer">orionstore://app/<span id="footer-id">—</span></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const appId = params.get('id') || '';
        const deepLink = 'orionstore://app/' + encodeURIComponent(appId);

        document.getElementById('app-label').textContent = appId || 'unknown';
        document.getElementById('footer-id').textContent = appId || '—';

        // Try to open the app via the custom scheme
        function attemptOpen() {
            window.location.href = deepLink;
        }

        // Show fallback after timeout
        setTimeout(function() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('fallback').classList.remove('hidden');
        }, 2000);

        document.getElementById('retry-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('fallback').classList.add('hidden');
            attemptOpen();
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('fallback').classList.remove('hidden');
            }, 2000);
        });

        // Attempt to open immediately
        attemptOpen();
    </script>
</body>
</html>
